tqdm = "^4.65.0"
cachetools = "^5.3.0"
psutil = "^5.9.0"
langchain = "^0.0.335"
langchain-community = "^0.0.13"
scipy = "<1.11"
faiss-cpu = "^1.7.4"
ollama = "^0.4.7"
setuptools = "^68.0.0"
wheel = "^0.42.0"
packaging = "^23.1"
sentence-transformers = "2.2.2"
huggingface-hub = "0.14.1"
chardet = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
