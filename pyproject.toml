pandas = "^2.0.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
torch = "^1.10.2"
torchvision = "^0.11.3"
transformers = "4.29.2"
streamlit = "^1.25.0"
plotly = "^5.15.0"
matplotlib = "^3.7.0"
numba = "^0.57.0"
