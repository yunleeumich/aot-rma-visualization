[tool.poetry]
name = "rma-analytics-dashboard"
version = "0.1.0"
description = "RMA Analytics Dashboard with optimized performance"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
